[package]
name = "neomind_extension_{{EXTENSION_NAME_UNDERSCORED}}"
version = "1.0.0"
edition = "2021"
authors = ["{{EXTENSION_AUTHOR}}"]
license = "MIT"
description = "{{EXTENSION_DESCRIPTION}}"

[lib]
name = "neomind_extension_{{EXTENSION_NAME_UNDERSCORED}}"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Prefer the published crate: the old `path = "../../../NeoMind/..."` dep
# only resolved when the core repo happened to be checked out next to this
# one, and broke every `neomind-ext new` since the workspace moved to the
# crates.io dependency.
neomind-extension-sdk = "0.6"
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = "0.1"
semver = "1"
chrono = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
