[workspace]
resolver = "2"
members = [
    # Shared runtime crate for vision extensions (NOT an extension itself;
    # release scripts glob extensions/ so keep shared crates under crates/)
    "crates/vision-common",
    # Extensions targeting the isolated NeoMind runtime protocol
    "extensions/weather-forecast-v2",
    "extensions/image-analyzer-v2",
    "extensions/yolo-video-v2",
    "extensions/video-vlm-v2",
    "extensions/yolo-device-inference",
    "extensions/ocr-device-inference",
    "extensions/face-recognition",
    "extensions/stream-player",
    "extensions/wasm-demo",
    "extensions/uink-rms-bridge",
    "extensions/modbus-bridge",
    "extensions/lorawan-bridge",
    "extensions/homeassistant-bridge",
    "extensions/opcua-bridge",
    "extensions/onvif-bridge",
    "extensions/bacnet-bridge",
    "extensions/locate-anything-v2",
    "extensions/moss-tts-nano",
    "extensions/sensevoice-asr",
    "extensions/cosyvoice-3",
    "extensions/voice-edge-tts",
    "extensions/voice-assistant",
    "extensions/paddle-ocr-v6",
    "extensions/paddle-ocr-vl",
    "extensions/deepstream",
    "extensions/gym-tracker",
    "extensions/vision-hub",
    # "extensions/final-test",
    # "extensions/cli-test-ext",
]


[workspace.package]
# Placeholder — no member uses version.workspace; the authoritative market
# version is the root VERSION file, per-crate versions live in their Cargo.toml.
version = "0.0.0"
edition = "2021"
authors = ["NeoMind"]
license = "MIT"

[workspace.dependencies]
# Minimal dependencies for WASM extensions
serde = { version = "1.0", features = ["derive"] }
# IMPORTANT: preserve_order feature is required for ABI compatibility between
# extension-runner and extension binaries. This ensures serde_json::Value uses
# IndexMap instead of HashMap, which has a stable memory layout across versions.
serde_json = { version = "1.0", features = ["preserve_order"] }
urlencoding = "2.1"
thiserror = "2.0"
async-trait = "0.1"

# ONNX Runtime - ort 2.0.0-rc.10 requires ORT 1.22.x (ORT_API_VERSION=22)
# usls 0.1.11 pins ort = "=2.0.0-rc.10"
# Use load-dynamic: ORT is loaded at runtime from bundled dylib/so/dll
ort = { version = "2.0.0-rc.10", default-features = false, features = ["half", "load-dynamic"] }

ndarray = "0.16"

neomind-extension-sdk = "0.6.6"

# Shared vision runtime (hardware accel abstraction, direct-ort engine,
# model wrappers, image IO, model manager) — consumed by vision extensions.
vision-common = { path = "crates/vision-common" }

# Patch usls to skip unreliable is_available() check for CUDA EP.
# When ORT is loaded dynamically (load-dynamic), GetAvailableProviders()
# may not report CUDA even though the GPU build supports it.
# The patched version directly tries to register the EP instead.
[patch.crates-io]
usls = { path = "patches/usls" }

[profile.release]
opt-level = 3
lto = "thin"
panic = "unwind"  # CRITICAL: Required for safe extension unloading and panic handling

[profile.dev]
opt-level = 1
lto = false
panic = "unwind"  # CRITICAL: Required for safe extension unloading and panic handling
