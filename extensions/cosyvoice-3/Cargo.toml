[package]
name = "cosyvoice-3"
version = "2.7.7"
edition = "2021"
authors = ["NeoMind Team"]
license = "Apache-2.0"
description = "CosyVoice 3 (Fun-CosyVoice3-0.5B) streaming TTS extension — speak on host audio + synthesize wav"

[lib]
name = "neomind_extension_cosyvoice_3"
crate-type = ["cdylib", "rlib"]

[dependencies]
neomind-extension-sdk = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
semver = "1"
base64 = "0.22"
parking_lot = "0.12"
tracing = "0.1"

# Native (non-wasm) deps
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
chrono = "0.4"
tokio = { version = "1", features = ["rt", "sync", "rt-multi-thread"] }
ureq = { version = "3", features = ["json"] }

# Audio playback: rodio for cross-platform host audio output.
# Kept for parity with moss-tts-nano — the `speak` command uses it.
# default-features = false disables the symphonia decoder bundle (we feed raw PCM).
# cpal (which rodio wraps) needs libasound2 on Linux at runtime.
[target.'cfg(all(not(target_arch = "wasm32"), target_os = "linux"))'.dependencies]
rodio = { version = "0.17", default-features = false }

[target.'cfg(all(not(target_arch = "wasm32"), target_os = "macos"))'.dependencies]
rodio = { version = "0.17", default-features = false }

[target.'cfg(all(not(target_arch = "wasm32"), target_os = "windows"))'.dependencies]
rodio = { version = "0.17", default-features = false }
