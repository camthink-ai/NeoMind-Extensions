[package]
name = "locate-anything-v2"
version = "2.7.7"
edition = "2021"
authors = ["NeoMind Team"]
license = "Apache-2.0"
description = "LocateAnything visual grounding extension - AI skill for object detection, phrase grounding, OCR, GUI grounding, and pointing via LocateAnything-3B model"

[lib]
name = "neomind_extension_locate_anything_v2"
crate-type = ["cdylib", "rlib"]

[dependencies]
neomind-extension-sdk = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
semver = "1"
base64 = "0.22"
parking_lot = "0.12"
tracing = "0.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
chrono = "0.4"
tokio = { version = "1", features = ["rt-multi-thread"] }
ureq = { version = "3", features = ["json"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
chrono = { version = "0.4", default-features = false, features = ["wasmbind"] }

[features]
default = []
native = []
wasm = []
