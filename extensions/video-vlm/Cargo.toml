[package]
name = "video-vlm"
version = "0.1.0"
edition = "2021"
authors = ["NeoMind Team"]
license = "Apache-2.0"
description = "Real-time video stream VLM understanding: RTSP/file input, frames analyzed by on-board LFM2.5-VL, text overlay + MJPEG streaming"

[lib]
name = "neomind_extension_video_vlm"
crate-type = ["cdylib", "rlib"]

[dependencies]
neomind-extension-sdk = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
chrono = "0.4"
semver = "1"
base64 = "0.22"
image = "0.25"
imageproc = "0.24"
ab_glyph = "0.2"
uuid = { version = "1.0", features = ["v4"] }
ureq = "2"
parking_lot = "0.12"
tracing = "0.1"
once_cell = "1.19"

# Native-only dependencies
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
# NVDEC hardware decode — opt-in via `nvdec` feature (Jetson only, needs libgstreamer1.0-dev)
gstreamer = { version = "0.21", optional = true }
gstreamer-app = { version = "0.21", optional = true }

[features]
default = []
native = []
wasm = []
# NVDEC hardware video decode via GStreamer nvv4l2decoder (Jetson only)
nvdec = ["dep:gstreamer", "dep:gstreamer-app"]
# Process isolation feature for high-risk extensions
process-isolated = []

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
neomind-extension-sdk = { workspace = true, features = ["testkit"] }
