[package]
name = "voice-assistant"
version = "2.7.7"
edition = "2021"
authors = ["NeoMind Team"]
license = "Apache-2.0"
description = "Real-time voice assistant orchestrator: mic → VAD → ASR → echo reply → TTS → speaker"

[lib]
name = "neomind_extension_voice_assistant"
crate-type = ["cdylib", "rlib"]

[dependencies]
neomind-extension-sdk = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
parking_lot = "0.12"
tracing = "0.1"

# Native (non-wasm) deps
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
chrono = "0.4"
tokio = { version = "1", features = ["rt", "sync", "rt-multi-thread", "net", "io-util", "macros"] }
tokio-tungstenite = { version = "0.23", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
