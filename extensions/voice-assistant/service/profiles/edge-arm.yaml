name: edge-arm
description: "RK3588 / Jetson Orin Nano, CPU-only, offline LLM"
hardware:
  cpu_threads: 6
acoustic:
  vad_backend: silero
  vad_threshold: 0.6
  vad_min_speech_ms: 300
  vad_silence_ms: 600
  aec: none
backends:
  asr:
    type: sensevoice_http
    url: http://127.0.0.1:9383
  llm:
    type: ollama_http
    url: http://127.0.0.1:11434
    model: qwen3:1.7b
  tts:
    type: zipvoice_http
    url: http://127.0.0.1:9386
    voice: 中文女
interaction:
  barge_in: full
  latency_target_ms: 1500
