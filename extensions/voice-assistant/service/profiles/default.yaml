name: default
description: "Developer default: M4 Pro + desktop mic + CN/EN"
hardware:
  cpu_threads: 4
acoustic:
  vad_backend: silero
  vad_threshold: 0.5
  vad_min_speech_ms: 250
  vad_silence_ms: 500
  aec: echo_window  # was: none (dead — env always overrode to echo_window at runtime)
backends:
  asr:
    type: sensevoice_http
    url: http://127.0.0.1:9383
    language: auto
  llm:
    type: neomind_ws
    url: ws://127.0.0.1:9375/api/chat
    token_env: NEOMIND_TOKEN
    auth_mode: api_key
    voice_mode: true
  tts:
    type: zipvoice_http
    url: http://127.0.0.1:9386
    voice: 中文女
interaction:
  barge_in: full
  latency_target_ms: 1200
  barge_in_ack: true
  ack_words: ["好的", "嗯哼", "明白"]
  stage_filler_words:
    thinking: ["让我想想", "嗯,让我想想", "稍等一下"]
    tool_call: ["我查一下", "搜索中", "查一下资料"]
  greeting_text: ""  # empty = disabled (opt-in due to AEC gap; see spec)
