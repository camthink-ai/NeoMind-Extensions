[package]
name = "vision-common"
version = "0.1.0"
edition = "2021"
authors = ["NeoMind Team"]
license = "Apache-2.0"
description = "Shared vision runtime for NeoMind extensions: hardware acceleration abstraction, ONNX model wrappers, image IO, drawing, model management. Direct ort integration (no usls)."

[lib]
name = "vision_common"
crate-type = ["rlib"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
base64 = "0.22"
image = "0.25"
imageproc = "0.24"
ab_glyph = "0.2"
parking_lot = "0.12"
tracing = "0.1"
ureq = { version = "2", features = ["json"] }
sha2 = "0.10"
chrono = "0.4"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }

# Direct ONNX Runtime integration (load-dynamic: dylib resolved at runtime)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ort = { workspace = true, optional = true }
ndarray = { workspace = true, optional = true }
libc = "0.2"

[features]
default = []
# Enable the direct-ort engine (EP registration + session building)
engine-ort = ["dep:ort", "dep:ndarray", "ort/coreml", "ort/cuda"]
# TensorRT EP registration (Jetson builds; requires an ORT dylib built with TRT)
tensorrt = ["engine-ort", "ort/tensorrt"]
# XNNPACK EP for accelerated CPU inference on ARM (reserved)
xnnpack = ["engine-ort", "ort/xnnpack"]

[dev-dependencies]
tempfile = "3"
